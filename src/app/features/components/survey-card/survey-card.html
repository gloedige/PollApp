<a 
    class="survey-card" 
    [routerLink]="canOpenDetail ? ['/detail', survey().id] : null" 
    [class.survey-card--ending-soon]="showsEndingSoonCard()" 
    (click)="canOpenDetail ? onSurveyClick() : $event.preventDefault()"
    [attr.aria-disabled]="!canOpenDetail"
    [attr.tabindex]="canOpenDetail ? 0 : -1">
    <div class="survey-card__header">
        <span class="survey-card__category" [class.survey-card__category--ending-soon]="showsEndingSoonCard()">{{ survey().category}}</span>
    </div>
    <div class="survey-card__body">
        <h2 class="survey-card__title" [class.survey-card__title--ending-soon]="showsEndingSoonCard()">{{ survey().title }}</h2>
    </div>
    <div class="survey-card__footer" [class.survey-card__footer--ending-soon]="showsEndingSoonCard()" [class.survey-card__footer--empty]="survey().id === 0">
        <p>{{endsInText}}</p>
    </div>
</a>
